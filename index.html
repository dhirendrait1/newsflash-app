<style>
:root{--ac:#ff453a;--rx:0deg;--ry:0deg;--tx:#e6eaf3;--mu:#8b94a8;--line:rgba(255,255,255,.14);--bg:#0b1020;--g1:rgba(255,255,255,.1);--g2:rgba(255,255,255,.03);--gf:rgba(255,255,255,.07);--sm:#b9c0cf;--on:#0b1020;--sh:rgba(0,0,0,.6);--hl:rgba(255,255,255,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
:root[data-theme="black"]{--bg:#000;--on:#000;--hl:rgba(255,255,255,.22)}
:root[data-theme="light"]{--bg:#cfcbe3;--tx:#1d2133;--mu:#5b6078;--sm:#363b52;--line:rgba(255,255,255,.72);--g1:rgba(255,255,255,.64);--g2:rgba(255,255,255,.34);--gf:rgba(255,255,255,.52);--on:#fff;--sh:rgba(70,55,120,.38);--hl:rgba(255,255,255,.95)}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:transparent;color:var(--tx);font-family:Sora,"Noto Sans Devanagari",system-ui,sans-serif;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.logo svg{width:28px;height:30px;filter:drop-shadow(0 0 6px rgba(255,69,58,.8))}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--gf)}
.lang button,.calm{font:inherit;color:var(--mu);background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.lang button.on{background:var(--ac);color:var(--on);font-weight:600}
.chip{margin:14px 0 4px;color:var(--mu);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:7px;box-shadow:0 0 8px var(--ac)}
.scene{height:170px;perspective:700px;touch-action:pan-y;display:flex;align-items:center;justify-content:center}
.tilt{transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s linear}
.ring{position:relative;width:150px;height:92px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.face{position:absolute;inset:0;border-radius:18px;border:1px solid var(--c);background:var(--gf);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;cursor:pointer;opacity:.45;transition:opacity .5s,box-shadow .5s}
.face b{font-size:17px;font-weight:600;color:var(--c)}
.face span{font-size:12px;color:var(--mu)}
.face.on{opacity:1;box-shadow:0 0 28px -4px var(--c),inset 0 0 18px -8px var(--c)}
.cards{margin-top:10px}
.card{position:relative;margin:0 0 12px;padding:14px 14px 12px 56px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .3s,box-shadow .3s;will-change:transform;box-shadow:0 8px 22px -12px var(--sh)}
.card .n{position:absolute;left:12px;top:14px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--ac);border:1px solid var(--ac);box-shadow:0 0 12px -2px var(--ac)}
.card h3{margin:0 0 6px;font-size:15px;font-weight:600;line-height:1.35}
.card p{margin:0;font-size:13px;line-height:1.55;color:var(--sm);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open p{-webkit-line-clamp:unset}
.card.open{border-color:var(--ac);box-shadow:0 0 24px -8px var(--ac)}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--mu)}
.meta em{font-style:normal;color:var(--ac)}
.card::after{content:"\203A";position:absolute;right:14px;top:8px;color:var(--mu);font-size:24px;line-height:1}
.card h3{padding-right:18px}
.bn{display:none;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 0;padding:8px 12px;border-radius:12px;border:1px solid var(--ac);font-size:12px;color:var(--sm)}
.bn .calm{margin:0;flex:none}
.sh{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);perspective:900px}
.sh.on{display:flex}
.pn{width:100%;max-width:480px;margin:0 auto;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;background:linear-gradient(160deg,var(--g1),var(--g2)),var(--bg);padding:18px 18px calc(26px + env(safe-area-inset-bottom,0px));box-shadow:0 -18px 50px -22px var(--ac);transform-origin:bottom;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:rotateX(35deg) translateY(40px);opacity:0}to{transform:none;opacity:1}}
.pn h2{font-size:19px;line-height:1.35;margin:8px 0 10px;font-weight:600}
.pn .lead{color:var(--tx);font-size:14px;line-height:1.55;margin:0 0 10px}
.pn ul{margin:0 0 14px;padding-left:20px}
.pn li{font-size:14px;color:var(--sm);margin:8px 0;line-height:1.55}
.pn .m2{font-size:12px;color:var(--mu)}
.pn .cf{font-size:12.5px;color:var(--ac);margin:0 0 14px}
.pn .x{float:right;font:inherit;color:var(--tx);background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer}
.b2{display:inline-block;text-decoration:none;background:var(--ac);color:var(--on);font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:999px}
.btn{text-decoration:none;display:none;margin-top:10px;font:inherit;font-size:12.5px;color:var(--on);background:var(--ac);border:0;border-radius:999px;padding:7px 14px}
.card.open .btn{display:inline-block}
footer{margin-top:18px;text-align:center;font-size:12px;color:var(--mu);line-height:1.7}
.calm{border:1px solid var(--line);margin-top:8px}
.calm+.calm{margin-left:8px}
.fd2{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 14px -8px var(--sh),inset 0 1px 0 rgba(255,255,255,.18);font-size:11.5px;white-space:nowrap;transform:perspective(500px) rotateX(8deg)}
.fd2 svg{width:15px;height:15px;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fd2 span{color:var(--mu)}.fd2 b{font-weight:600;color:var(--tx)}
.calm.on{color:var(--ac);border-color:var(--ac)}

.tools{display:flex;gap:6px;margin:10px 0 0}
.tools button{flex:1;font:inherit;font-size:12.5px;color:var(--sm);background:var(--gf);border:1px solid var(--line);border-radius:999px;padding:8px 4px;cursor:pointer;white-space:nowrap}
.tools button.on{color:var(--ac);border-color:var(--ac)}
.mk{display:none;gap:6px;overflow-x:auto;margin:8px 0 0;padding-bottom:2px}
.mk span{flex:none;font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--gf);color:var(--sm);white-space:nowrap}
.mk b{color:var(--tx);font-weight:600}.mk i{font-style:normal}.up{color:#34d399}.dn{color:#ff5a52}
.srch{display:none;margin:10px 0 0}
.srch input{width:100%;font:inherit;font-size:14px;color:var(--tx);background:var(--gf);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
body[data-v="search"] .srch{display:block}
body:not([data-v="news"]) .scene,body:not([data-v="news"]) .brief{display:none}
.brief{margin:6px 0 4px;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2))}
.brief h4{margin:0 0 4px;font-size:13px;color:var(--mu);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.brief ol{margin:0;padding-left:18px}
.brief li{font-size:13.5px;margin:7px 0;line-height:1.4;cursor:pointer;color:var(--tx)}
.brief .pl{font:inherit;font-size:12px;color:var(--ac);background:none;border:1px solid var(--ac);border-radius:999px;padding:4px 11px;cursor:pointer}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;font-weight:600}
.tag.new{color:#06241a;background:#34d399}
.card h3{font-size:calc(15px*var(--z,1))}.card p{font-size:calc(13px*var(--z,1))}
.pn h2{font-size:calc(19px*var(--z,1))}.pn li{font-size:calc(14px*var(--z,1))}.pn .lead{font-size:calc(14px*var(--z,1))}
.sec{font-size:11px;margin:0 0 3px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.acts button{font:inherit;font-size:12.5px;color:var(--tx);background:var(--gf);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer}
.acts button.on{color:var(--ac);border-color:var(--ac)}
.ol{margin:4px 0 6px}
.ol a{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--tx);font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--gf)}
.ol small{color:var(--mu);font-size:11px;flex:none}
.empty{text-align:center;color:var(--mu);font-size:13px;padding:34px 12px;line-height:1.6}

.lang button.on{background:linear-gradient(180deg,#a595ff,#6a55f0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 12px -6px rgba(106,85,240,.8)}
.bn .calm{background:linear-gradient(180deg,#a595ff,#6a55f0);color:#fff;border:0;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 14px -8px rgba(106,85,240,.85)}
.tools button,.acts button,.pl{border-radius:999px}
#asv{background:linear-gradient(180deg,#7fe6d8,#2fb5a6);color:#06302c;border:0;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 12px rgba(0,80,75,.25),0 10px 18px -10px rgba(47,181,166,.85)}
#asv.on{background:linear-gradient(180deg,#a595ff,#6a55f0);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 18px -10px rgba(106,85,240,.85)}
.brief{background:linear-gradient(135deg,rgba(255,140,170,.34),rgba(160,130,255,.34) 50%,rgba(90,190,255,.30));border-radius:24px}
:root[data-theme="light"] .brief{background:linear-gradient(135deg,rgba(255,170,190,.82),rgba(190,160,255,.8) 50%,rgba(140,210,255,.8))}
.srch{position:relative}
.srch input{border-radius:999px;padding:12px 56px 12px 18px}
#qx{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;font:inherit;font-size:20px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#a595ff,#6a55f0);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 14px -6px rgba(106,85,240,.8)}
.pn .x{background:var(--gf)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:60;pointer-events:none;border-radius:999px;padding:10px 20px;font-size:13px;color:var(--tx);border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2)),var(--bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 1px 1px 0 var(--hl),0 14px 26px -12px var(--sh);transition:.35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){.ring,.tilt{transition:none}}
</style>

function load(){OLD=null;fetch("news/"+L+".json",{cache:"no-store"}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){setD(j,true)}).catch(function(){D=null;draw()})}
function setD(j,fresh){D=j;D.sections.forEach(function(s,i){s.points.forEach(function(p){p.sec=i})});if(fresh){markSeen();hist()}draw()}
function markSeen(){var k="nfSeen:"+L,st=ls(k,null),links=[];
D.sections.forEach(function(s){s.points.forEach(function(p){links.push(p.link)})});
if(!st||st.gen!==D.generated){PREV=st?st.links:null;ss(k,{gen:D.generated,links:links})}else{PREV=st.prev||null}
if(st&&st.gen!==D.generated)ss(k,{gen:D.generated,links:links,prev:st.links})}
function hist(){var H=ls("nfHist",{});H[L]=H[L]||{};H[L][D.generated]=D;Object.keys(H[L]).sort().reverse().slice(10).forEach(function(k){delete H[L][k]});ss("nfHist",H)}
function banner(){var t=T[L],m="",b="";
if(OLD){m=t.old+dtl(D.generated);b=t.latest}
else if(!D){m=t.bn;b=t.rt}
else{var h=(Date.now()-Date.parse(D.generated))/36e5;if(h>20){m=t.stale.replace("{h}",Math.round(h));b=t.rt}}
$("bn").style.display=m?"flex":"none";$("bt").textContent=m;$("br").textContent=b}
function mc(n,o){return o&&o.usd!=null?'<span>'+n+' <b>$'+Math.round(o.usd).toLocaleString("en-US")+'</b>'+(o.chg!=null?' <i class="'+(o.chg>=0?"up":"dn")+'">'+(o.chg>=0?"▲":"▼")+Math.abs(o.chg).toFixed(1)+'%</i>':'')+'</span>':""}
function mkt(){var m=D&&D.market,h="";if(m)h=mc("BTC",m.btc)+mc("ETH",m.eth)+(m.usdinr?'<span>USD/INR <b>'+Number(m.usdinr).toFixed(2)+'</b></span>':"");
$("mk").innerHTML=h;$("mk").style.display=h?"flex":"none"}
function top3(){if(!D)return[];var a=[];D.sections.forEach(function(s,si){s.points.forEach(function(p,pi){a.push({p:p,k:(p.confirmed||0)*100-si*10-pi})})});a.sort(function(x,y){return y.k-x.k});return a.slice(0,3).map(function(x){return x.p})}
function isSaved(p){return SAVED.some(function(x){return x.link===p.link})}
function toggleSave(p){var i=-1;SAVED.forEach(function(x,j){if(x.link===p.link)i=j});
if(i>=0)SAVED.splice(i,1);else{var c=JSON.parse(JSON.stringify(p));SAVED.unshift(c);SAVED=SAVED.slice(0,60)}ss("nfSaved",SAVED)}
function share(p){var tx=p.headline+" - News Flash";if(navigator.share){navigator.share({title:p.headline,text:tx,url:p.link}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(tx+"\n"+p.link)}}
function listen(text,btn,idle){var sy=window.speechSynthesis,t=T[L];if(!sy)return;
if(sy.speaking){sy.cancel();if(btn)btn.textContent=idle;return}
var u=new SpeechSynthesisUtterance(text);u.lang=L==="hi"?"hi-IN":"en-IN";u.onend=function(){if(btn)btn.textContent=idle};sy.cancel();sy.speak(u);if(btn)btn.textContent=t.stop}
function openS(p){var t=T[L],bl=p.bullets&&p.bullets.length,ls_=bl?p.bullets:(p.summary?[p.summary]:[]);
var mt=[p.source,tm(p.published)].filter(Boolean).join(" · ");
var outs=p.outlets&&p.outlets.length?p.outlets:(p.link?[{name:p.source,link:p.link}]:[]);var sv=isSaved(p);
$("sh").innerHTML='<div class="pn"><button class="x" id="sx" aria-label="Close">\u2715</button><div class="m2">'+esc(mt)+'</div><h2>'+esc(p.headline)+'</h2>'+(bl?'<p class="lead">'+esc(p.summary)+'</p>':'')+'<ul>'+ls_.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul><div class="acts"><button id="asv" class="'+(sv?"on":"")+'">'+(sv?t.saved:t.save)+'</button><button id="ash">'+t.share+'</button>'+(window.speechSynthesis?'<button id="als">'+t.listen+'</button>':"")+'</div><div class="cf">'+((p.confirmed||0)<2?t.dev:t.ok+esc(p.confirmed))+'</div>'+(outs.length?'<div class="m2">'+t.cov+'</div><div class="ol">'+outs.map(function(o){var u=/^https?:/.test(o.link)?o.link:"#";return'<a href="'+esc(u)+'" target="_blank" rel="noopener"><span>'+esc(o.name)+'</span><small>'+esc(typ(o.name))+' \u2197</small></a>'}).join("")+'</div>':"")+'</div>';
$("sh").className="sh on";$("sx").onclick=closeS;
$("asv").onclick=function(){toggleSave(p);var s2=isSaved(p);this.className=s2?"on":"";this.textContent=s2?t.saved:t.save;toast(s2?t.saved:t.rm);if(view==="saved")draw()};
$("ash").onclick=function(){share(p)};
if($("als"))$("als").onclick=function(){listen(p.headline+". "+(bl?p.bullets.join(". "):(p.summary||"")),this,t.listen)}}
function toast(m){var e=$("ts");e.textContent=m;e.className="toast show";clearTimeout(window._tt);window._tt=setTimeout(function(){e.className="toast"},1600)}
function closeS(){if(window.speechSynthesis)speechSynthesis.cancel();$("sh").className="sh"}
function ring(){var r=$("ring");r.innerHTML="";S.forEach(function(s,i){var f=document.createElement("div");f.className="face";f.style.setProperty("--c",s.c);f.style.transform="rotateY("+i*90+"deg) translateZ(112px)";f.innerHTML="<b></b><span></span>";f.onclick=function(){go(i)};r.appendChild(f)})}
function go(i){I=(i+4)%4;draw()}
function cardH(p,t,n,showSec){var nw=PREV&&!OLD&&PREV.indexOf(p.link)<0,dv=(p.confirmed||0)<2;
return '<div class="card"><div class="n">'+esc(n)+'</div>'+(showSec&&p.sec!=null&&S[p.sec]?'<div class="sec" style="color:'+S[p.sec].c+'">'+esc(S[p.sec].n[L])+'</div>':'')+'<h3>'+esc(p.headline)+(nw?'<span class="tag new">'+t.nw+'</span>':'')+'</h3><p>'+esc(p.summary)+'</p><div class="meta"><span>'+esc(p.source)+' · '+tm(p.published)+'</span><em'+(dv?' style="color:#ffa62b"':'')+'>'+(dv?t.dev:t.ok+esc(p.confirmed))+'</em></div></div>'}
function find(){var q=QRY.trim().toLowerCase(),out=[];if(q.length<2||!D)return out;
D.sections.forEach(function(s){s.points.forEach(function(p){if((p.headline+" "+p.summary+" "+(p.bullets||[]).join(" ")).toLowerCase().indexOf(q)>=0)out.push(p)})});return out}
function draw(){
var t=T[L],s=S[I];
document.documentElement.style.setProperty("--ac",s.c);
document.body.setAttribute("data-v",view);
$("ring").style.transform="rotateY("+(-I*90)+"deg)";
Array.prototype.forEach.call($("ring").children,function(f,i){f.className="face"+(i===I?" on":"");f.firstChild.textContent=S[i].n[L];f.lastChild.textContent=K(i)+" "+t.pt});
banner();mkt();
$("ed").textContent=D?edN(D)+" · "+tm(D.generated):t.ed;
$("cnt").textContent=view==="news"?K(I)+" "+t.pt:"";
$("ft").textContent=D?(L==="hi"?"अपडेट: ":"Updated: ")+tm(D.generated):t.ft;$("fl").textContent=t.fl;$("fn").textContent=t.fn;
$("calm").textContent=t.calm[calm?1:0];$("th").textContent=t.th[TH==="dark"?0:(TH==="light"?1:2)];document.body.className=calm?"calm":"";$("calm").className="calm"+(calm?" on":"");
$("tsr").textContent=t.sr;$("tsv").textContent=t.sv+(SAVED.length?" ("+SAVED.length+")":"");$("ths").textContent=t.hs;
$("tsr").className=view==="search"?"on":"";$("tsv").className=view==="saved"?"on":"";$("ths").className=view==="history"?"on":"";$("q").placeholder=t.ph;
document.documentElement.lang=L==="hi"?"hi":"en";
var h="";CUR=[];HK=[];
if(view==="news"){var pp=D&&D.sections[I]?D.sections[I].points:null;CUR=pp||[];
if(pp){pp.forEach(function(p){h+=cardH(p,t,p.rank,false)})}
else for(var n=1;n<=s.k;n++){h+='<div class="card"><div class="n">'+n+'</div><h3>'+t.h+n+'</h3><p>'+t.s+'</p><div class="meta"><span>'+t.src+'</span><em>'+t.ok+(n%3+2)+'</em></div></div>';CUR.push({rank:n,headline:t.h+n,summary:t.s,source:"Source name",published:"",confirmed:n%3+2,bullets:[],link:""})}}
else if(view==="saved"){CUR=SAVED.slice();h=CUR.length?CUR.map(function(p,i){return cardH(p,t,i+1,true)}).join(""):'<div class="empty">'+t.nosaved+'</div>'}
else if(view==="search"){CUR=find();h=CUR.length?CUR.map(function(p,i){return cardH(p,t,i+1,true)}).join(""):'<div class="empty">'+(QRY.trim().length<2?t.hint:t.nores)+'</div>'}
else if(view==="history"){var H=(ls("nfHist",{})[L])||{};HK=Object.keys(H).sort().reverse().map(function(k){return H[k]});
h=HK.length?HK.map(function(d,i){var c=0;d.sections.forEach(function(x){c+=x.points.length});return '<div class="card"><div class="n">'+(i+1)+'</div><h3>'+esc(edN(d))+'</h3><p>'+esc(dtl(d.generated))+' · '+c+' '+t.pt+'</p></div>'}).join(""):'<div class="empty">'+t.nohist+'</div>'}
$("cards").innerHTML=h;
Array.prototype.forEach.call($("cards").children,function(c,i){c.onclick=function(){
if(view==="history"){if(HK[i]){OLD=HK[i];view="news";setD(OLD,false);scrollTo(0,0)}}else if(CUR[i])openS(CUR[i])}});
BR=(view==="news"&&D)?top3():[];
$("brief").innerHTML=BR.length?'<h4><span>'+t.brief+'</span><button class="pl" id="bp">'+t.play+'</button></h4><ol>'+BR.map(function(p){return'<li>'+esc(p.headline)+'</li>'}).join("")+'</ol>':"";
if(BR.length){Array.prototype.forEach.call($("brief").getElementsByTagName("li"),function(li,i){li.onclick=function(){openS(BR[i])}});
$("bp").onclick=function(){listen(t.brief+". "+BR.map(function(p){return p.headline+". "+(p.summary||"")}).join(" "),this,t.play)}}
depth()}
function setView(v){view=view===v?"news":v;draw();if(view==="search")setTimeout(function(){$("q").focus()},60);scrollTo(0,0)}
function depth(){
var cs=$("cards").children,m=innerHeight/2;
for(var i=0;i<cs.length;i++){
if(calm||!cs[i].getBoundingClientRect){if(cs[i].style){cs[i].style.transform="";cs[i].style.opacity=1}continue}
var b=cs[i].getBoundingClientRect(),d=((b.top+b.height/2)-m)/innerHeight;
d=Math.max(-1,Math.min(1,d));var a=Math.abs(d);
cs[i].style.transform="perspective(800px) translateZ("+(-a*40)+"px) rotateX("+(d*10)+"deg) scale("+(1-a*.03)+")";
cs[i].style.opacity=Math.max(.35,1-a*.5)}}
var q=false;addEventListener("scroll",function(){if(!q){q=true;requestAnimationFrame(function(){q=false;depth()})}},{passive:true});
addEventListener("resize",depth);
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){L=b.dataset.l;document.querySelectorAll(".lang button").forEach(function(x){x.classList.toggle("on",x===b)});load()}});
$("calm").onclick=function(){calm=!calm;if(calm){$("tilt").style.setProperty("--rx","0deg");$("tilt").style.setProperty("--ry","0deg")}draw()};
$("tsr").onclick=function(){setView("search")};$("tsv").onclick=function(){setView("saved")};$("ths").onclick=function(){setView("history")};
$("taz").onclick=function(){VZ=VZ<1.1?1.12:(VZ<1.2?1.25:1);ss("nfZ",VZ);document.documentElement.style.setProperty("--z",VZ)};
$("q").oninput=function(){QRY=this.value;draw()};
$("qx").onclick=function(){QRY="";$("q").value="";draw();$("q").focus()};
var x0=null,sc=$("scene");
sc.addEventListener("pointerdown",function(e){x0=e.clientX});
sc.addEventListener("pointerup",function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>35)go(I+(dx<0?1:-1))});
addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(I+1);if(e.key==="ArrowLeft")go(I-1);if(e.key==="Escape")closeS()});
function tilt(rx,ry){if(calm)return;var t=$("tilt");t.style.setProperty("--rx",rx+"deg");t.style.setProperty("--ry",ry+"deg")}
function cl(v,m){return Math.max(-m,Math.min(m,v))}
addEventListener("deviceorientation",function(e){if(e.gamma==null)return;tilt(Math.round(cl((e.beta-45)/5,10)),Math.round(cl(e.gamma/3,14)))});
sc.addEventListener("pointermove",function(e){var r=sc.getBoundingClientRect();tilt(Math.round(-((e.clientY-r.top)/r.height-.5)*16),Math.round(((e.clientX-r.left)/r.width-.5)*24))});
var C={dark:["#ff5a52","#ffa62b","#34d399","#ffd24a"],light:["#d93a32","#b45f00","#17803a","#8f6400"]};
try{TH=localStorage.getItem("nfTheme")||"dark";if(TH!=="black"&&TH!=="light")TH="dark"}catch(e){}
function applyTheme(){document.documentElement.setAttribute("data-theme",TH);var cs=C[TH==="light"?"light":"dark"];S.forEach(function(s,i){s.c=cs[i]});var m=document.querySelector&&document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",TH==="light"?"#cfcbe3":(TH==="black"?"#000000":"#0b1020"));ring();draw()}
$("th").onclick=function(){TH=TH==="dark"?"light":(TH==="light"?"black":"dark");try{localStorage.setItem("nfTheme",TH)}catch(e){}applyTheme()};
$("br").onclick=load;$("sh").onclick=function(e){if(e.target===$("sh"))closeS()};
applyTheme();load();
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
