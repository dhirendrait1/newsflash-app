<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Flash</title>
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Flash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ac:#ff453a;--rx:0deg;--ry:0deg;--tx:#e6eaf3;--mu:#8b94a8;--line:rgba(255,255,255,.14);--bg:#0b1020;--g1:rgba(255,255,255,.1);--g2:rgba(255,255,255,.03);--gf:rgba(255,255,255,.07);--sm:#b9c0cf;--on:#0b1020;--sh:rgba(0,0,0,.6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
:root[data-theme="black"]{--bg:#000;--on:#000}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Sora,"Noto Sans Devanagari",system-ui,sans-serif;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.logo svg{width:28px;height:30px;filter:drop-shadow(0 0 6px rgba(255,69,58,.8))}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--gf)}
.lang button,.calm{font:inherit;color:var(--mu);background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.lang button.on{background:var(--ac);color:var(--on);font-weight:600}
.chip{margin:14px 0 4px;color:var(--mu);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:7px;box-shadow:0 0 8px var(--ac)}
.scene{height:170px;perspective:700px;touch-action:pan-y;display:flex;align-items:center;justify-content:center}
.tilt{transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s linear}
.ring{position:relative;width:150px;height:92px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.face{position:absolute;inset:0;border-radius:18px;border:1px solid var(--c);background:var(--gf);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;cursor:pointer;opacity:.45;transition:opacity .5s,box-shadow .5s}
.face b{font-size:17px;font-weight:600;color:var(--c)}
.face span{font-size:12px;color:var(--mu)}
.face.on{opacity:1;box-shadow:0 0 28px -4px var(--c),inset 0 0 18px -8px var(--c)}
.cards{margin-top:10px;perspective:800px}
.card{position:relative;margin:0 0 12px;padding:14px 14px 12px 56px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .3s,box-shadow .3s;will-change:transform;box-shadow:0 8px 22px -12px var(--sh)}
.card .n{position:absolute;left:12px;top:14px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--ac);border:1px solid var(--ac);box-shadow:0 0 12px -2px var(--ac)}
.card h3{margin:0 0 6px;font-size:15px;font-weight:600;line-height:1.35}
.card p{margin:0;font-size:13px;line-height:1.55;color:var(--sm);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open p{-webkit-line-clamp:unset}
.card.open{border-color:var(--ac);box-shadow:0 0 24px -8px var(--ac)}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--mu)}
.meta em{font-style:normal;color:var(--ac)}
.btn{text-decoration:none;display:none;margin-top:10px;font:inherit;font-size:12.5px;color:var(--on);background:var(--ac);border:0;border-radius:999px;padding:7px 14px}
.card.open .btn{display:inline-block}
footer{margin-top:18px;text-align:center;font-size:12px;color:var(--mu);line-height:1.7}
.calm{border:1px solid var(--line);margin-top:8px}
.calm+.calm{margin-left:8px}
.fd2{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 14px -8px var(--sh),inset 0 1px 0 rgba(255,255,255,.18);font-size:11.5px;white-space:nowrap;transform:perspective(500px) rotateX(8deg)}
.fd2 svg{width:15px;height:15px;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fd2 span{color:var(--mu)}.fd2 b{font-weight:600;color:var(--tx)}
.calm.on{color:var(--ac);border-color:var(--ac)}
@media (prefers-reduced-motion:reduce){.ring,.tilt{transition:none}}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo"><svg viewBox="0 0 24 26" aria-hidden="true"><defs><path id="bz" d="M13 2 4 14h6l-1 8 9-12h-6z"/></defs><g transform="translate(1 0)"><use href="#bz" x="1.6" y="1.6" fill="#5e0f0b"/><use href="#bz" x="1.3" y="1.3" fill="#7a1410"/><use href="#bz" x="1" y="1" fill="#942019"/><use href="#bz" x=".7" y=".7" fill="#b02a21"/><use href="#bz" x=".4" y=".4" fill="#cf3429"/><use href="#bz" fill="#ff5a4d" stroke="#ffd2cc" stroke-width=".2" stroke-linejoin="round"/></g></svg><span>News Flash</span></div>
<div class="lang" role="group" aria-label="Language"><button data-l="en" class="on">EN</button><button data-l="hi">हिं</button></div>
</header>
<div class="fd2"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span id="fl"></span><b id="fn"></b></div>
<div class="chip"><span><i></i><span id="ed"></span></span><span id="cnt"></span></div>
<div class="scene" id="scene"><div class="tilt" id="tilt"><div class="ring" id="ring"></div></div></div>
<div class="cards" id="cards"></div>
<footer><div id="ft"></div><button class="calm" id="calm"></button><button class="calm" id="th"></button></footer>
</div>
<script>
var S=[
{n:{en:"Breaking",hi:"ब्रेकिंग"},k:10,c:"#ff453a"},
{n:{en:"India",hi:"भारत"},k:5,c:"#ff9f0a"},
{n:{en:"Finance",hi:"वित्त"},k:10,c:"#30d158"},
{n:{en:"Crypto",hi:"क्रिप्टो"},k:10,c:"#ffd60a"}];
var T={
en:{ed:"Morning Flash · 6:00 AM",pt:"points",h:"Sample headline for point ",s:"A one or two line summary in plain words will appear here, written for fast reading.",src:"Source name · 6:02 AM",ok:"✓ Confirmed by ",btn:"Read source",ft:"Demo data · Next: Evening Flash, 5:00 PM",fl:"Founder ·",fn:"Dhirendra Pandey",calm:["Calm mode: off","Calm mode: on"],th:["Theme: Midnight","Theme: Black"]},
hi:{ed:"मॉर्निंग फ्लैश · सुबह 6:00",pt:"बिंदु",h:"नमूना शीर्षक, बिंदु ",s:"यहाँ दो पंक्तियों में सरल भाषा में सारांश दिखेगा, तेज़ पढ़ने के लिए।",src:"स्रोत का नाम · सुबह 6:02",ok:"✓ पुष्टि: ",btn:"स्रोत पढ़ें",ft:"डेमो डेटा · अगला: इवनिंग फ्लैश, शाम 5:00",fl:"संस्थापक ·",fn:"धीरेंद्र पांडेय",calm:["शांत मोड: बंद","शांत मोड: चालू"],th:["थीम: मिडनाइट","थीम: ब्लैक"]}};
var D=null,L="en",I=0,calm=false,TH="dark",$=function(i){return document.getElementById(i)};
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tm(iso){try{return new Date(iso).toLocaleTimeString(L==="hi"?"hi-IN":"en-IN",{hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function K(i){return D&&D.sections[i]?D.sections[i].points.length:S[i].k}
function edT(){var m=D.edition==="morning";return (L==="hi"?(m?"मॉर्निंग फ्लैश":"इवनिंग फ्लैश"):(m?"Morning Flash":"Evening Flash"))+" · "+tm(D.generated)}
function load(){fetch("news/"+L+".json",{cache:"no-store"}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){D=j;draw()}).catch(function(){D=null;draw()})}
function ring(){var r=$("ring");r.innerHTML="";S.forEach(function(s,i){var f=document.createElement("div");f.className="face";f.style.setProperty("--c",s.c);f.style.transform="rotateY("+i*90+"deg) translateZ(112px)";f.innerHTML="<b></b><span></span>";f.onclick=function(){go(i)};r.appendChild(f)})}
function go(i){I=(i+4)%4;draw()}
function draw(){
var t=T[L],s=S[I];
document.documentElement.style.setProperty("--ac",s.c);
$("ring").style.transform="rotateY("+(-I*90)+"deg)";
Array.prototype.forEach.call($("ring").children,function(f,i){f.className="face"+(i===I?" on":"");f.firstChild.textContent=S[i].n[L];f.lastChild.textContent=K(i)+" "+t.pt});
$("ed").textContent=D?edT():t.ed;$("cnt").textContent=K(I)+" "+t.pt;$("ft").textContent=D?(L==="hi"?"अपडेट: ":"Updated: ")+tm(D.generated):t.ft;$("fl").textContent=t.fl;$("fn").textContent=t.fn;
$("calm").textContent=t.calm[calm?1:0];$("th").textContent=t.th[TH==="dark"?0:1];$("calm").className="calm"+(calm?" on":"");
document.documentElement.lang=L==="hi"?"hi":"en";
var h="",pp=D&&D.sections[I]?D.sections[I].points:null;
if(pp){pp.forEach(function(p){var u=/^https?:/.test(p.link)?p.link:"#";h+='<div class="card"><div class="n">'+esc(p.rank)+'</div><h3>'+esc(p.headline)+'</h3><p>'+esc(p.summary)+'</p><div class="meta"><span>'+esc(p.source)+' · '+tm(p.published)+'</span><em>'+t.ok+esc(p.confirmed)+'</em></div><a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">'+t.btn+'</a></div>'})}
else for(var n=1;n<=s.k;n++){h+='<div class="card"><div class="n">'+n+'</div><h3>'+t.h+n+'</h3><p>'+t.s+'</p><div class="meta"><span>'+t.src+'</span><em>'+t.ok+(n%3+2)+'</em></div><button class="btn">'+t.btn+'</button></div>'}
$("cards").innerHTML=h;
Array.prototype.forEach.call($("cards").children,function(c){c.onclick=function(){c.classList.toggle("open")}});
depth()}
function depth(){
var cs=$("cards").children,m=innerHeight/2;
for(var i=0;i<cs.length;i++){
if(calm){cs[i].style.transform="";cs[i].style.opacity=1;continue}
var b=cs[i].getBoundingClientRect(),d=((b.top+b.height/2)-m)/innerHeight;
d=Math.max(-1,Math.min(1,d));var a=Math.abs(d);
cs[i].style.transform="translateZ("+(-a*70)+"px) rotateX("+(d*16)+"deg) scale("+(1-a*.04)+")";
cs[i].style.opacity=Math.max(.35,1-a*.5)}}
var q=false;addEventListener("scroll",function(){if(!q){q=true;requestAnimationFrame(function(){q=false;depth()})}},{passive:true});
addEventListener("resize",depth);
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){L=b.dataset.l;document.querySelectorAll(".lang button").forEach(function(x){x.classList.toggle("on",x===b)});load()}});
$("calm").onclick=function(){calm=!calm;if(calm){$("tilt").style.setProperty("--rx","0deg");$("tilt").style.setProperty("--ry","0deg")}draw()};
var x0=null,sc=$("scene");
sc.addEventListener("pointerdown",function(e){x0=e.clientX});
sc.addEventListener("pointerup",function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>35)go(I+(dx<0?1:-1))});
addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(I+1);if(e.key==="ArrowLeft")go(I-1)});
function tilt(rx,ry){if(calm)return;var t=$("tilt");t.style.setProperty("--rx",rx+"deg");t.style.setProperty("--ry",ry+"deg")}
function cl(v,m){return Math.max(-m,Math.min(m,v))}
addEventListener("deviceorientation",function(e){if(e.gamma==null)return;tilt(Math.round(cl((e.beta-45)/5,10)),Math.round(cl(e.gamma/3,14)))});
sc.addEventListener("pointermove",function(e){var r=sc.getBoundingClientRect();tilt(Math.round(-((e.clientY-r.top)/r.height-.5)*16),Math.round(((e.clientX-r.left)/r.width-.5)*24))});
var C={dark:["#ff5a52","#ffa62b","#34d399","#ffd24a"]};
try{TH=localStorage.getItem("nfTheme")||"dark";if(TH!=="black")TH="dark"}catch(e){}
function applyTheme(){document.documentElement.setAttribute("data-theme",TH);S.forEach(function(s,i){s.c=C.dark[i]});ring();draw()}
$("th").onclick=function(){TH=TH==="dark"?"black":"dark";try{localStorage.setItem("nfTheme",TH)}catch(e){}applyTheme()};
applyTheme();load();
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
